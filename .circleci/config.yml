version: 2
jobs:
  build:
    working_directory: ~/app
    docker:
      - image: morygonzalez/portalshit:latest
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
        environment:
          RAILS_ENV: test
    steps:
      - checkout
      - run:
          name: Bundle install
          command: |
            bundle config set path /usr/local/bundle
            bundle config set without 'mysql postgresql'
            bundle install -j1
      - run:
          name: DEBUG diagnostics
          command: |
            echo "--- ruby-level pwd/realpath ---"
            ruby -e "puts Dir.pwd; puts File.realpath('.'); puts File.exist?('Gemfile'); puts File.exist?('./Gemfile')"
            echo "--- Bundler.default_gemfile ---"
            ruby -rbundler -e "puts Bundler.default_gemfile" || true
            echo "--- readlink /app/app ---"
            readlink -f /app/app 2>&1
            echo "--- /app/app contents ---"
            ls -la /app/app | head -20
            echo "--- diff /app/Gemfile vs ./Gemfile ---"
            diff /app/Gemfile ./Gemfile && echo IDENTICAL || echo DIFFERENT
            echo "--- ./Gemfile realpath ---"
            realpath ./Gemfile
            echo "--- bundle config list (all sources) ---"
            bundle config list 2>&1 || true
            echo "--- BUNDLE_GEMFILE env ---"
            printenv BUNDLE_GEMFILE || echo "(not set)"
      - run:
          name: Generate MeCab userdic
          command: |
            /usr/lib/mecab/mecab-dict-index \
              -d /usr/lib/x86_64-linux-gnu/mecab/dic/mecab-ipadic-neologd \
              -u lib/tokenizer/userdic.dic \
              -f utf-8 -t utf-8 \
              lib/tokenizer/userdic.csv
      - run:
          name: Database set up
          command: |
            : > db/test.sqlite3
            RACK_ENV=test bundle exec rake db:migrate
      - run:
          name: Run rspec
          command: |
            RACK_ENV=test bundle exec rspec --format progress
