version: 2
jobs:
  build:
    working_directory: ~/app
    docker:
      - image: morygonzalez/portalshit:latest
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
        environment:
          RAILS_ENV: test
    steps:
      - checkout
      - run:
          name: Bundle install
          command: |
            bundle config set path /usr/local/bundle
            bundle config set without 'mysql postgresql'
            bundle install -j1
      - run:
          name: DEBUG diagnostics
          command: |
            echo "--- pwd/id/env ---"
            pwd
            id
            echo "HOME=$HOME"
            env | grep -i bundle
            echo "--- Gemfile pins ---"
            grep -nE "activerecord|activesupport" Gemfile
            echo "--- Gemfile.lock pins ---"
            grep -nE "^    (activerecord|activesupport) \(" Gemfile.lock
            echo "--- bundle list ---"
            bundle list 2>&1 | grep -iE "activerecord|activesupport"
            echo "--- installed gem dirs ---"
            ls /usr/local/bundle/ruby/*/gems/ | grep -E "^activerecord|^activesupport"
            echo "--- bundle exec check ---"
            bundle exec ruby -e "require 'active_support'; puts ActiveSupport::VERSION::STRING" || true
            echo "--- BUNDLE_GEMFILE ---"
            bundle env 2>&1 | grep -iE "gemfile|path" || true
      - run:
          name: Generate MeCab userdic
          command: |
            /usr/lib/mecab/mecab-dict-index \
              -d /usr/lib/x86_64-linux-gnu/mecab/dic/mecab-ipadic-neologd \
              -u lib/tokenizer/userdic.dic \
              -f utf-8 -t utf-8 \
              lib/tokenizer/userdic.csv
      - run:
          name: Database set up
          command: |
            : > db/test.sqlite3
            RACK_ENV=test bundle exec rake db:migrate
      - run:
          name: Run rspec
          command: |
            RACK_ENV=test bundle exec rspec --format progress
