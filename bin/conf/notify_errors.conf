# 502/504 エラー通知設定
# 500 系エラーは exception_notification gem で通知するため、
# このスクリプトではアプリ外の問題（Puma 過負荷/タイムアウト）のみ監視する

# 通知先メールアドレス
NOTIFY_TO="morygonzalez@gmail.com"

# 通知元メールアドレス
NOTIFY_FROM="portal shit! <info@portalshit.net>"

# 通知対象のステータスコード（grep -P の正規表現）
NOTIFY_STATUS_PATTERN="status:50[24]"

# メール本文に含めるエラーの最大件数
MAX_ERRORS_IN_MAIL=50

# AWS SES リージョン
AWS_REGION="us-east-1"
